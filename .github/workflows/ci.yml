# Quality gates (D-096): build (warnings are errors), tests, formatting, vulnerable packages and a portable package
# check of the single executable (D-103). Nothing is released or published from CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build IPMaster.slnx -c Release
      # a hung test would block forever: the step has its own limit. The xUnit in-process
      # runner (not `dotnet test`) is used so that -longRunning names any test still running after 60 s in the log.
      - run: dotnet tests/IPMaster.Tests/bin/Release/net10.0/IPMaster.Tests.dll -longRunning 60
        timeout-minutes: 15

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build IPMaster.slnx -c Release

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet format IPMaster.slnx --verify-no-changes --verbosity minimal

  licence:
    name: Licence (GPL-3.0-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # D-115: LICENSE is the unmodified GNU GPLv3 text (https://www.gnu.org/licenses/gpl-3.0.txt)
      - name: Check LICENSE, metadata and notices
        shell: pwsh
        run: |
          $hash = (Get-FileHash LICENSE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986') { throw "LICENSE is not the official GPLv3 text (sha256 $hash)" }
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup
          $lic = $props.PackageLicenseExpression | Where-Object { $_ } | Select-Object -First 1
          if ($lic -ne 'GPL-3.0-only') { throw "PackageLicenseExpression is '$lic', expected GPL-3.0-only" }
          $repoUrl = $props.RepositoryUrl | Where-Object { $_ } | Select-Object -First 1
          if ($repoUrl -ne 'https://github.com/muratbulat/ipmaster') { throw "RepositoryUrl is '$repoUrl'" }
          $wxs = Get-Content scripts/installer/msi/Package.wxs -Raw
          foreach ($f in @('THIRD-PARTY-NOTICES.md') + @(Get-ChildItem licenses -File | ForEach-Object { "licenses/$($_.Name)" })) {
            if (-not (Test-Path $f)) { throw "missing $f" }
            if ($wxs -notmatch [regex]::Escape($f.Replace('/', '\'))) { throw "the MSI does not install $f" }
          }
          if (Select-String -Path README.md, website/*.html, website/*/*.html -Pattern 'all rights reserved|no (open-source )?licen[cs]e has been published') { throw 'contradictory licence wording' }
          'Licence OK: GPL-3.0-only'

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore IPMaster.slnx
      - name: Fail on known vulnerable packages (direct and transitive)
        shell: bash
        run: |
          dotnet list IPMaster.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  package:
    name: Packages (win-x64, portable and normal)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # publish.ps1 itself fails when the executable is missing, a second executable is present, or the published
      # IPMaster.exe does not answer --cli /version (D-103)
      - name: Build the portable package
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtimes win-x64 -Root artifacts/ci -Format All
      - name: Verify the package
        shell: pwsh
        run: |
          $exe = 'artifacts/ci/release/win-x64/IPMaster.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $exes = @(Get-ChildItem artifacts/ci/release/win-x64 -Filter *.exe)
          if ($exes.Count -ne 1) { throw "expected one executable, found: $($exes.Name -join ', ')" }
          $zip = @(Get-ChildItem artifacts/ci/packages -Filter 'IPMaster-*-win-x64.zip')
          if ($zip.Count -ne 1) { throw 'missing the versioned zip' }
          if (@(Get-ChildItem artifacts/ci/packages -Filter 'IPMaster-*-win-x64-portable.zip').Count -ne 1) { throw 'missing the portable zip' }
          $portable = 'artifacts/ci/release/win-x64-portable/IPMaster.exe'
          if (-not (Test-Path $portable) -or @(Get-ChildItem (Split-Path $portable) -Filter *.exe).Count -ne 1) { throw "portable package: expected one $portable" }
          if ((& $portable --cli /version) -notmatch '^IPMaster \d') { throw 'the portable executable did not run' }
          $version = & $exe --cli /version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^IPMaster \d+\.\d+\.\d+') { throw "unexpected /version output: $version" }
          & $exe --bogus 2>$null
          if ($LASTEXITCODE -ne 1) { throw "an unknown argument must exit 1, got $LASTEXITCODE" }
          & $exe --cli /help > help.txt
          if ($LASTEXITCODE -ne 0 -or (Get-Content help.txt).Count -lt 10) { throw 'redirected help is missing' }
          # MSI (D-105): built by WiX with ICE validation; publish.ps1 already checked its ProductVersion
          $msi = @(Get-ChildItem artifacts/ci/packages -Filter 'IPMaster-*-win-x64-setup-framework-dependent.msi')
          if ($msi.Count -ne 1) { throw 'missing the MSI' }
          # D-115: LICENSE, notices and the source revision in both zips and the MSI
          $wanted = 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'SOURCE.txt', 'licenses/Apache-2.0.txt'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($z in Get-ChildItem artifacts/ci/packages -Filter 'IPMaster-*-win-x64*.zip') {
            $a = [System.IO.Compression.ZipFile]::OpenRead($z.FullName)
            try { $names = @($a.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }) } finally { $a.Dispose() }
            foreach ($w in $wanted) { if ($names -notcontains $w) { throw "$($z.Name) lacks $w" } }
          }
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.OpenDatabase($msi[0].FullName, 0)
          $view = $db.OpenView("SELECT FileName FROM File")
          $view.Execute()
          $files = @(while ($r = $view.Fetch()) { ($r.StringData(1) -split '\|')[-1] })
          $view.Close()
          foreach ($w in 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'SOURCE.txt', 'Apache-2.0.txt') { if ($files -notcontains $w) { throw "the MSI lacks $w" } }
          $sums = Get-Content artifacts/ci/packages/SHA256SUMS.txt
          foreach ($f in @($zip[0], $msi[0])) { if (-not ($sums -match [regex]::Escape($f.Name))) { throw "SHA256SUMS.txt lacks $($f.Name)" } }
          "Package OK: $version ($($zip.Name), $($msi.Name))"
      # kept 7 days for inspection; this is not a release
      - uses: actions/upload-artifact@v4
        with:
          name: IPMaster-win-x64
          path: |
            artifacts/ci/packages/IPMaster-*-win-x64.zip
            artifacts/ci/packages/IPMaster-*-win-x64-setup-framework-dependent.msi
          retention-days: 7
