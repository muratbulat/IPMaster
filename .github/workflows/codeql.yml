# CodeQL security analysis of the C# code (D-096). On a private repository it needs GitHub Advanced Security
# (code scanning); without it this workflow fails at upload and can be disabled in the Actions tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build IPMaster.slnx -c Release
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
